name: Build Cra for macOS 12.6 (CEF 150)

on:
  workflow_dispatch:
  push:
    branches: [macos12]

jobs:
  build:
    name: Build Cra.app (arm64, macOS 12.6+, CEF 150)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CRA_ENGINE: cef
      CRA_ALLOW_STOCK_CEF: "1"
      # OBS Studio 33's own CEF 150 build (branch 7871): built with Chromium's proprietary codecs,
      # so H.264/AAC/HEVC play (Spotify's stock build has none), and still minos 12.0. Chromium 151+
      # needs macOS 13. The hash is the one OBS pins in its CMakePresets.json (obs-studio 33.0.1).
      CEF_VERSION: "150.0.19+gcf60f42+chromium-150.0.7871.252"
      CEF_URL: "https://cdn-fastly.obsproject.com/downloads/cef_binary_7871_macos_arm64.tar.xz"
      CEF_SHA256: "0343233fc462384c2f1f58a4222028bc6171f05948a822241f89df2faa7cee8d"
      MACOSX_DEPLOYMENT_TARGET: "12.6"
    steps:
      - uses: actions/checkout@v4

      - name: Check toolchain
        run: |
          xcodebuild -version
          swift --version
          cmake --version || brew install cmake

      - name: Restore CEF 150 cache
        id: cef-cache
        uses: actions/cache/restore@v4
        with:
          path: vendor/cef
          key: cef-obs-7871-${{ env.CEF_SHA256 }}-macosarm64-12.6

      - name: Fetch OBS's CEF 150 (with codecs)
        if: steps.cef-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf vendor/cef && mkdir -p vendor/cef
          curl -fsSL "$CEF_URL" -o cef.tar.xz
          echo "$CEF_SHA256  cef.tar.xz" | shasum -a 256 -c -
          tar -xJf cef.tar.xz -C vendor/cef   # OBS's archive has no top-level folder
          rm cef.tar.xz
          grep -q "\"$CEF_VERSION\"" vendor/cef/include/cef_version.h
          echo "$CEF_URL" > vendor/cef/.cra-source   # fetch-cef.sh then keeps it and only builds the wrapper

      - name: Build CEF 150 wrapper
        if: steps.cef-cache.outputs.cache-hit != 'true'
        run: scripts/fetch-cef.sh

      - name: Save CEF 150 cache
        if: steps.cef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vendor/cef
          key: cef-obs-7871-${{ env.CEF_SHA256 }}-macosarm64-12.6

      - name: Restore SwiftPM build cache
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: swiftpm-macos12-${{ hashFiles('Package.swift', 'Packages/CraCore/Package.swift') }}-${{ github.run_id }}
          restore-keys: |
            swiftpm-macos12-${{ hashFiles('Package.swift', 'Packages/CraCore/Package.swift') }}-
            swiftpm-macos12-

      - name: Build Cra.app
        run: scripts/build.sh release

      - name: Save SwiftPM build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .build
          key: swiftpm-macos12-${{ hashFiles('Package.swift', 'Packages/CraCore/Package.swift') }}-${{ github.run_id }}

      - name: Package Cra.app
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/Cra.app Cra-macOS12-arm64.zip
          ls -lh Cra-macOS12-arm64.zip

      - name: Upload Cra-macOS12-arm64.zip
        uses: actions/upload-artifact@v4
        with:
          name: Cra-macOS12-arm64
          path: Cra-macOS12-arm64.zip
          retention-days: 14

      # After the upload, so a failing test still leaves the build to try. The proxy, WebRTC and
      # exit IP decisions (ProxySettingTests, ExitIPTests) and the settings lists they join.
      - name: CraCore tests (network privacy)
        run: swift test --package-path Packages/CraCore --filter "ProxySettingTests|ExitIPTests|SharingTests|ModelFixtureTests"
